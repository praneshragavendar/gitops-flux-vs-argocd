# Tells Flux to watch ./apps/mompop-cafe/overlays/flux in this repo and keep the cluster in sync with it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mompop-cafe
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/mompop-cafe/overlays/flux
  # Delete objects from the cluster when they are removed from Git
  prune: true
  # Mark the sync as Ready only when the Deployments are actually healthy
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
