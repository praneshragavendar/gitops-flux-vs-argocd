# Tells Flux to keep ./apps/java-app/overlays/flux in sync with the cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: java-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/java-app/overlays/flux
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
