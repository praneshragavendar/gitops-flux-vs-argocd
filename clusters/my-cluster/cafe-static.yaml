# Tells Flux to keep ./apps/cafe-static/overlays/flux in sync with the cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cafe-static
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/cafe-static/overlays/flux
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
