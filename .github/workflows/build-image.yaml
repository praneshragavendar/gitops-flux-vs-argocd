name: Build and push app images

on:
  # Every push to main that touches an app: build the images to make sure they still build (no push)
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-image.yaml"]
    # A version tag (v1.0.0, v1.1.0 ...): build AND push to GitHub Container Registry
    tags: ["v*"]
  pull_request:
    paths: ["app/**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { context: app/web,    image: mompop-cafe-web }   # PHP + MySQL (dynamic)
          - { context: app/static, image: cafe-static-web }   # nginx (static)
          - { context: app/java,   image: java-app }          # Maven WAR on Tomcat (Java)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase
      - name: Set image name
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
