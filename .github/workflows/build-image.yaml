name: Build and push web image

on:
  # Every push to main that touches the app: build the image to make sure it still builds (no push)
  push:
    branches: [main]
    paths: ["app/web/**", ".github/workflows/build-image.yaml"]
    # A version tag (v1.0.0, v1.1.0 ...): build AND push to GitHub Container Registry
    tags: ["v*"]
  pull_request:
    paths: ["app/web/**"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mompop-cafe-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase
      - name: Set image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: app/web
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
