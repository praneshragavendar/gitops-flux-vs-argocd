apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-podmonitor.yaml
  - argocd-servicemonitors.yaml

# Grafana's sidecar loads any ConfigMap with this label as a dashboard
configMapGenerator:
  - name: gitops-comparison-dashboard
    namespace: monitoring
    files:
      - dashboards/gitops-comparison.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
