apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-web
  labels:
    app: cafe-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafe-web
  template:
    metadata:
      labels:
        app: cafe-web
    spec:
      containers:
        - name: cafe-web
          # Built and pushed by .github/workflows/build-image.yaml when a v* tag is pushed
          image: ghcr.io/praneshragavendar/mompop-cafe-web:v1.0.0
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: cafe-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cafe-db-secret
                  key: app-password
          readinessProbe:
            httpGet:
              path: /index.php
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.php
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
